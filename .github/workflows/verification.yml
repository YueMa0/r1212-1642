name: Verification contracts and quick graph checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  quick-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install numpy networkx
      - name: Check mathematical source and generator hashes
        working-directory: lean
        run: sha256sum --check audit/sources.sha256
      - name: Exercise verifier and audit failure contracts
        run: python -m unittest discover -s verify -p 'test_*contracts.py'
      - name: Exercise generator output safety
        run: python -m unittest discover -s r1212_corollary/gen -p 'test_gen_h01_io.py'
      - name: Check the supplied graph
        run: PY=python3 verify/run_checks.sh
